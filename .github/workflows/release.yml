name: Release
# Usage: Push a version number tag e.g. "v0.8.2". This will run the release
# build and create a draft release in GitHub UI for you to approve or delete.
#
# It also runs on push to master or on pull requests, but without creating
# a GitHub release.

on:
  push:
    tags: ["v[0-9]*"]
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  REPO: git-graph

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin_extension: ""
            os_name: "linux-amd64"
          - os: windows-latest
            bin_extension: ".exe"
            os_name: "windows-amd64"
          - os: macos-latest
            bin_extension: ""
            os_name: "macos-amd64"

    steps:
      - uses: actions/checkout@v7

      - name: Get tag or commit
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "RELEASE_VERSION=${SHORT_SHA}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build
        run: |
          cargo build --release

      - name: Compress
        run: |
          cp -f target/release/$REPO${{ matrix.bin_extension }} .
          ARCHIVE="$REPO-$RELEASE_VERSION-${{ matrix.os_name }}.tar.gz"
          tar -czf $ARCHIVE $REPO${{ matrix.bin_extension }}
        shell: bash

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.REPO }}-${{ env.RELEASE_VERSION }}-${{ matrix.os_name }}
          path: ${{ env.REPO }}-${{ env.RELEASE_VERSION }}-${{ matrix.os_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    # Explicitly grant GITHUB_TOKEN write access to attach binaries to the release
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.REPO }}-${{ github.ref_name }}-*
          path: artifacts
          merge-multiple: false

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            artifacts/*/*.tar.gz
